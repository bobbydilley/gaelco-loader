# Gaelco Loader display configuration.
#
# Put this file next to the game executable (the one you pass to ./gaelco),
# or in the working directory you launch from. You can also point at it
# explicitly with the GAELCO_INI environment variable.
#
# The game renders at a fixed internal resolution (640x480 for Tokyo Cop
# and Ring Riders, 720x540 for Championship Tuning Race). By default the
# loader makes the window that same size and does no scaling. Set a
# width/height (or fullscreen) below to scale the game up, letterboxed to
# keep its aspect ratio.

[display]

# 1 = borderless fullscreen at the desktop resolution, 0 = windowed.
# Alt+Enter toggles this at runtime too.
fullscreen = 0

# Windowed output size. Leave both commented out (or 0) to match the
# game's own resolution 1:1 - recommended, and required for Championship
# Tuning Race, whose multi-pass renderer does not survive being scaled.
# width  = 1280
# height = 960

# 1 = pillar/letterbox to preserve 4:3, 0 = stretch to fill.
keep_aspect = 1

# 1 = only scale by whole-number factors (2x, 3x, ...) for crisp pixels.
integer_scale = 0

# Advanced: override the internal render resolution. Leave these alone
# unless you know the game supports it.
# render_width  = 640
# render_height = 480
